[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speculative-decoding-demo"
version = "0.1.0"
requires-python = ">=3.10"
description = "Deterministic CPU-only toy speculative decoding"

[project.scripts]
sdd = "speculative_decoding_demo.cli:main"

[tool.setuptools.packages.find]
include = ["speculative_decoding_demo*"]
